<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="Bar charts of total commits, commits per day, and unique contributors for DataFusion releases 53, 54, and 55. All three measures grew in each release.">
  <title>DataFusion development activity: releases 53.0.0 to 55.0.0</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .panel-title { font-size: 15px; font-weight: 600; fill: #2c3e50; }
    .value { font-size: 13px; font-weight: 600; fill: #2c3e50; }
    .release { font-size: 12px; fill: #555; }
  </style>
  <rect width="900" height="240" fill="#ffffff"/>

  <!-- Panel 1: Total commits (blue) -->
  <text class="panel-title" x="150" y="28" text-anchor="middle">Commits</text>
  <line x1="40" y1="195.5" x2="260" y2="195.5" stroke="#dee2e6" stroke-width="1.5"/>
  <path fill="#3498db" d="M56 195 V123 Q56 119 60 119 H96 Q100 119 100 123 V195 Z"/>
  <path fill="#3498db" d="M128 195 V81 Q128 77 132 77 H168 Q172 77 172 81 V195 Z"/>
  <path fill="#3498db" d="M200 195 V59 Q200 55 204 55 H240 Q244 55 244 59 V195 Z"/>
  <text class="value" x="78" y="113" text-anchor="middle">475</text>
  <text class="value" x="150" y="71" text-anchor="middle">740</text>
  <text class="value" x="222" y="49" text-anchor="middle">877</text>
  <text class="release" x="78" y="213" text-anchor="middle">53.0.0</text>
  <text class="release" x="150" y="213" text-anchor="middle">54.0.0</text>
  <text class="release" x="222" y="213" text-anchor="middle">55.0.0</text>

  <!-- Panel 2: Commits per day (green) -->
  <text class="panel-title" x="450" y="28" text-anchor="middle">Commits / day</text>
  <line x1="340" y1="195.5" x2="560" y2="195.5" stroke="#dee2e6" stroke-width="1.5"/>
  <path fill="#008000" d="M356 195 V122 Q356 118 360 118 H396 Q400 118 400 122 V195 Z"/>
  <path fill="#008000" d="M428 195 V91 Q428 87 432 87 H468 Q472 87 472 91 V195 Z"/>
  <path fill="#008000" d="M500 195 V59 Q500 55 504 55 H540 Q544 55 544 59 V195 Z"/>
  <text class="value" x="378" y="112" text-anchor="middle">6.8</text>
  <text class="value" x="450" y="81" text-anchor="middle">9.6</text>
  <text class="value" x="522" y="49" text-anchor="middle">12.4</text>
  <text class="release" x="378" y="213" text-anchor="middle">53.0.0</text>
  <text class="release" x="450" y="213" text-anchor="middle">54.0.0</text>
  <text class="release" x="522" y="213" text-anchor="middle">55.0.0</text>

  <!-- Panel 3: Unique contributors (orange) -->
  <text class="panel-title" x="750" y="28" text-anchor="middle">Contributors</text>
  <line x1="640" y1="195.5" x2="860" y2="195.5" stroke="#dee2e6" stroke-width="1.5"/>
  <path fill="#e67e22" d="M656 195 V108 Q656 104 660 104 H696 Q700 104 700 108 V195 Z"/>
  <path fill="#e67e22" d="M728 195 V88 Q728 84 732 84 H768 Q772 84 772 88 V195 Z"/>
  <path fill="#e67e22" d="M800 195 V59 Q800 55 804 55 H840 Q844 55 844 59 V195 Z"/>
  <text class="value" x="678" y="98" text-anchor="middle">114</text>
  <text class="value" x="750" y="78" text-anchor="middle">139</text>
  <text class="value" x="822" y="49" text-anchor="middle">175</text>
  <text class="release" x="678" y="213" text-anchor="middle">53.0.0</text>
  <text class="release" x="750" y="213" text-anchor="middle">54.0.0</text>
  <text class="release" x="822" y="213" text-anchor="middle">55.0.0</text>
</svg>
